[package]
name = "aqua-rust"
version = "0.1.0"
edition = "2021"
description = "AQUA Platform - multi-protocol AI API gateway + user platform (Rust rewrite)"

[[bin]]
name = "aqua-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "tls-none"] }
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
regex = "1"
hmac = "0.12"
sha2 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc", "std"] }
hkdf = "0.12"
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
mimalloc = "0.1"
url = "2"
percent-encoding = "2"
once_cell = "1"
socket2 = "0.5"
libc = "0.2"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
strip = "none"

[profile.dev]
opt-level = 1

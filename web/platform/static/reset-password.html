<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>重置密码 - AQUA 公益AI</title>
  <link rel="stylesheet" href="/static/css/platform.css?v=24.0">
  <link rel="stylesheet" href="/static/css/icons.css?v=1.0">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-title">重置密码</div>
      <div class="auth-subtitle">通过邮箱验证后设置新密码</div>

      <!-- 步骤1：输入邮箱 -->
      <div id="step-email">
        <div class="input-group">
          <label>邮箱</label>
          <input type="email" class="input" id="email" name="email" placeholder="请输入注册邮箱" required>
        </div>
        <div class="input-group">
          <label>验证码</label>
          <div style="display:flex;gap:8px">
            <input type="text" class="input" id="code" name="code" placeholder="6位验证码" maxlength="6" style="flex:1" required>
            <button type="button" class="btn" id="send-code-btn" onclick="sendCode()" style="white-space:nowrap">获取验证码</button>
          </div>
        </div>
        <div class="input-group">
          <label>新密码</label>
          <input type="password" class="input" id="password" name="password" placeholder="至少8位，包含字母和数字" required autocomplete="new-password">
        </div>
        <div class="input-group">
          <label>确认密码</label>
          <input type="password" class="input" id="password2" name="password2" placeholder="再次输入新密码" required autocomplete="new-password">
        </div>
        <button type="button" class="btn btn-primary btn-block btn-lg" id="reset-btn" onclick="doReset()">重置密码</button>
      </div>

      <!-- 步骤2：成功提示 -->
      <div id="step-success" style="display:none;text-align:center;padding:20px 0">
        <div style="font-size:56px;margin-bottom:16px"><span class="icon-svg icon-check-circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-5"/></svg></span></div>
        <div style="font-size:18px;font-weight:600;margin-bottom:8px">密码重置成功</div>
        <div style="color:var(--text-secondary);font-size:14px;margin-bottom:24px">您可以使用新密码登录了</div>
        <a href="/login" class="btn btn-primary btn-block">返回登录</a>
      </div>

      <div class="auth-links">
        <a href="/login">返回登录</a>
        <a href="/register">注册账号</a>
      </div>

      <div style="margin-top:24px;text-align:center">
        <a href="/" class="text-sm text-muted">← 返回首页</a>
      </div>
    </div>
  </div>

  <!-- 广告位 -->
  <div class="ads-section" style="margin-top:32px">
    <div class="ads-title">— 赞助商 —</div>
    <div class="ads-row">
      <a class="ad-card" href="https://idc.61nb.cn/aff/PRISUTPY" target="_blank" rel="nofollow">
        <img src="/static/images/sponsors/61nb.png" alt="安逸云"><div class="ad-info"><div class="ad-name">安逸云</div><div class="ad-desc">高性价比云服务器 · 特价9.9起</div></div>
      </a>
      <a class="ad-card" href="https://www.tokenlinks.cn/sign-up?aff=o4JN" target="_blank" rel="nofollow">
        <img src="/static/images/sponsors/tokenlinks.svg" alt="TokenLinks"><div class="ad-info"><div class="ad-name">TokenLinks</div><div class="ad-desc">主流高性能模型，更快接入，更低成本。</div></div>
      </a></div>
  </div>

  <script src="/static/js/platform.js?v=24.0"></script>
  <script>
    let countdown = 0;
    let timer = null;

    function sendCode() {
      const email = document.getElementById('email').value.trim();
      if (!email) { Toast.warn('请输入邮箱'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { Toast.warn('邮箱格式不正确'); return; }

      const btn = document.getElementById('send-code-btn');
      if (countdown > 0) return;

      btn.disabled = true;
      btn.textContent = '发送中...';

      API.post('/api/auth/send-code', { email: email, purpose: 'reset_password' })
        .then(function () {
          Toast.success('验证码已发送，请查收邮箱');
          startCountdown();
        })
        .catch(function (err) {
          Toast.error(err.message || '发送失败');
          btn.disabled = false;
          btn.textContent = '获取验证码';
        });
    }

    function startCountdown() {
      countdown = 60;
      const btn = document.getElementById('send-code-btn');
      btn.disabled = true;
      timer = setInterval(function () {
        countdown--;
        if (countdown <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '获取验证码';
        } else {
          btn.textContent = countdown + 's 后重发';
        }
      }, 1000);
    }

    function doReset() {
      const email = document.getElementById('email').value.trim();
      const code = document.getElementById('code').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (!email) { Toast.warn('请输入邮箱'); return; }
      if (!code) { Toast.warn('请输入验证码'); return; }
      if (!password) { Toast.warn('请输入新密码'); return; }
      if (password.length < 8) { Toast.warn('密码至少8位'); return; }
      if (password !== password2) { Toast.warn('两次密码不一致'); return; }

      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      btn.textContent = '重置中...';

      API.post('/api/auth/reset-password', {
        email: email,
        code: code,
        password: password
      })
        .then(function () {
          Toast.success('密码重置成功');
          document.getElementById('step-email').style.display = 'none';
          document.getElementById('step-success').style.display = 'block';
        })
        .catch(function (err) {
          Toast.error(err.message || '重置失败');
          btn.disabled = false;
          btn.textContent = '重置密码';
        });
    }

    // 回车提交
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && document.getElementById('step-email').style.display !== 'none') {
        doReset();
      }
    });
  </script>
</body>
</html>

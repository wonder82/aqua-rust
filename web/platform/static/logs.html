<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>请求日志 - AQUA 公益AI</title>
  <link rel="stylesheet" href="/static/css/platform.css?v=24.0">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand"><a href="/" class="brand-logo"><span class="brand-name">AQUA</span><span class="brand-tag">公益AI</span></a></div>
      <div class="navbar-actions">
        <button class="icon-btn" data-theme-toggle title="切换主题" onclick="Theme.toggle()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
        <a href="/" class="btn btn-sm">回首页</a>
      </div>
    </div>
  </nav>

  <div class="console-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="console-content">
      <div class="flex justify-between items-center mb-24">
        <h1>请求日志</h1>
        <button class="btn btn-sm" onclick="loadLogs(currentPage)">刷新</button>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>模型</th><th>类型</th><th>状态</th><th>输入Token</th><th>输出Token</th><th>缓存Token</th><th>总Token</th><th>延迟</th><th>时间</th></tr></thead>
            <tbody id="logs-tbody">
              <tr><td colspan="9" class="text-center text-muted">加载中...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="pagination"></div>
      </div>
    </div>
  </div>

  <script src="/static/js/platform.js?v=24.0"></script>
  <script>
    let currentProfile = null;
    let currentPage = 1;
    const pageSize = 20;

    requireAuth().then(function (profile) {
      if (!profile) { var _cc = document.querySelector('.console-content'); if (_cc) _cc.innerHTML = '<div style="padding:60px 20px;text-align:center"><p style="font-size:16px;margin-bottom:16px;color:var(--text-secondary)">连接服务失败，请刷新页面重试</p><button onclick="location.reload()" style="padding:8px 24px;border:1px solid var(--accent-primary);background:transparent;color:var(--accent-primary);border-radius:6px;cursor:pointer">刷新重试</button></div>'; return; }
      currentProfile = profile;
      AquaPlatform.renderConsoleSidebar('logs');
      loadLogs(1);
    });

    function loadLogs(page) {
      currentPage = page;
      const tbody = document.getElementById('logs-tbody');
      tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted"><div class="spinner" style="margin:0 auto"></div></td></tr>';

      API.get('/api/user/request-logs?page=' + page + '&page_size=' + pageSize).then(function (data) {
        const logs = data.data || [];
        if (!logs.length) {
          tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-state-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/></svg></div><div class="empty-state-text">暂无请求日志</div></div></td></tr>';
          document.getElementById('pagination').innerHTML = '';
          return;
        }
        tbody.innerHTML = logs.map(function (log) {
          return '<tr>' +
            '<td class="mono text-sm">' + escapeHtml(log.model || '-') + '</td>' +
            '<td>' + (log.is_stream ? '<span class="tag">流式</span>' : '<span class="tag">非流式</span>') + '</td>' +
            '<td>' + Fmt.status(log.status) + '</td>' +
            '<td>' + Fmt.number(log.prompt_tokens || 0) + '</td>' +
            '<td>' + Fmt.number(log.completion_tokens || 0) + '</td>' +
            '<td>' + Fmt.number(log.cached_tokens || 0) + '</td>' +
            '<td>' + Fmt.number(log.total_tokens || 0) + '</td>' +
            '<td>' + Fmt.latency(log.latency_ms || 0) + '</td>' +
            '<td class="text-sm text-muted">' + Fmt.time(log.created_at) + '</td>' +
            '</tr>';
        }).join('');

        renderPagination(document.getElementById('pagination'), data.total || 0, page, pageSize, function (p) {
          loadLogs(p);
        });
      }).catch(function (err) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">加载失败</td></tr>';
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>密钥管理 - AQUA AI</title>
  <link rel="stylesheet" href="/static/css/platform.css?v=24.0">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand"><a href="/" class="brand-logo"><span class="brand-name">AQUA</span><span class="brand-tag">AI</span></a></div>
      <div class="navbar-actions">
        <button class="icon-btn" data-theme-toggle title="切换主题" onclick="Theme.toggle()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
        <a href="/" class="btn btn-sm">回首页</a>
      </div>
    </div>
  </nav>

  <div class="console-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="console-content">
      <div class="flex justify-between items-center mb-24">
        <h1>密钥管理</h1>
        <button class="btn btn-primary" onclick="showCreateModal()">+ 创建密钥</button>
      </div>

      <!-- 一键导入到 AI 工具 -->
      <div class="card mb-16" style="border-left:3px solid var(--accent-primary)">
        <div class="card-title" style="margin-bottom:12px">一键导入到 AI 工具</div>
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
          <div style="flex:1;min-width:140px">
            <label class="text-xs text-secondary">选择密钥</label>
            <select class="select" id="qs-key-select" style="width:100%;margin-top:4px" onchange="onQSChange()">
              <option value="">选择密钥...</option>
            </select>
          </div>
          <div style="flex:2;min-width:200px">
            <label class="text-xs text-secondary">选择模型</label>
            <select class="select" id="qs-model-select" style="width:100%;margin-top:4px" onchange="onQSChange()">
              <option value="">加载中...</option>
            </select>
          </div>
          <div style="flex:1;min-width:120px">
            <label class="text-xs text-secondary">目标软件</label>
			<select class="select" id="qs-sw-select" style="width:100%;margin-top:4px" onchange="renderQSModels()">
              <option value="ccswitch-claude">CC Switch → Claude Code</option>
              <option value="ccswitch-codex">CC Switch → Codex</option>
              <option value="ccswitch-gemini">CC Switch → Gemini</option>
              <option value="codex">Codex CLI</option>
              <option value="codebuddy">CodeBuddy</option>
              <option value="workbuddy">WorkBuddy</option>
              <option value="astrbot">AstrBot</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="openQuickImport()" id="qs-import-btn" disabled>一键生成配置</button>
        </div>
      </div>

      <!-- API 地址展示 -->
      <div class="card mb-16" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span class="text-secondary">API 地址：</span>
        <code class="mono" style="flex:1;min-width:200px">https://api.example.com/v1</code>
        <button class="btn btn-sm" onclick="copyText('https://api.example.com/v1')">复制</button>
      </div>

      <!-- 密钥表格 -->
      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>密钥前缀</th><th>备注</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody id="keys-tbody">
              <tr><td colspan="5" class="text-center text-muted">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/platform.js?v=24.0"></script>
  <script>
    let currentProfile = null;
    let keysData = [];

    requireAuth().then(function (profile) {
      if (!profile) { var _cc = document.querySelector('.console-content'); if (_cc) _cc.innerHTML = '<div style="padding:60px 20px;text-align:center"><p style="font-size:16px;margin-bottom:16px;color:var(--text-secondary)">连接服务失败，请刷新页面重试</p><button onclick="location.reload()" style="padding:8px 24px;border:1px solid var(--accent-primary);background:transparent;color:var(--accent-primary);border-radius:6px;cursor:pointer">刷新重试</button></div>'; return; }
      currentProfile = profile;
      AquaPlatform.renderConsoleSidebar('keys');
      loadKeys();
      // 确保模型加载在 DOM 就绪后立即执行（与认证并行，不依赖登录态）
      initQS();
    });

    function loadKeys() {
      API.get('/api/user/keys').then(function (data) {
        keysData = data.data || [];
        renderKeys();
        updateQSKeys();
        // 密钥列表加载后重新检查按钮状态
        onQSChange();
      }).catch(function () {
        document.getElementById('keys-tbody').innerHTML = '<tr><td colspan="5" class="text-center text-muted">加载失败</td></tr>';
      });
    }

    // ============ 一键导入功能 ============
    var qsModels = [];

	function qsModelType(m) {
	  return m.model_type || m.modelType || 'chat';
	}

	function qsModelSupported(m, sw) {
	  var type = qsModelType(m);
	  var available = m.available !== false && !m.is_deprecated && !m.isDeprecated;
	  if (!available || type === 'embedding' || type === 'safety' || type === 'translation') return false;
	  if (sw === 'ccswitch-claude') return m.supports_tool_call === true || m.supports_tools === true || m.supportsTools === true;
	  return true;
	}

    function renderQSModels() {
      var sel = document.getElementById('qs-model-select');
	  var sw = document.getElementById('qs-sw-select').value;
	  var supportedModels = qsModels.filter(function(m) { return qsModelSupported(m, sw); });
	  if (!supportedModels.length) {
        sel.innerHTML = '<option value="">模型加载失败，请刷新</option>';
        onQSChange();
        return;
      }
      var hot = ['meta/llama-3.1-70b-instruct','nvidia/nemotron-3-ultra-550b-a55b',
        'nvidia/nemotron-3-super-120b-a12b','minimaxai/minimax-m3',
        'stepfun-ai/step-3.7-flash','openai/gpt-oss-120b','google/gemma-4-31b-it',
        'mistralai/mistral-nemotron'];
	  var hotList = supportedModels.filter(function(m) { return hot.indexOf(m.id) !== -1; });
      var groups = {};
	  supportedModels.forEach(function(m) {
		var p = m.publisher || m.owned_by || m.pub || '其他';
        if (!groups[p]) groups[p] = [];
        groups[p].push(m);
      });
	  sel.innerHTML = '';
	  var placeholder = document.createElement('option');
	  placeholder.value = '';
	  placeholder.textContent = '选择模型...';
	  sel.appendChild(placeholder);
	  function appendGroup(label, models) {
		if (!models.length) return;
		var group = document.createElement('optgroup');
		group.label = label;
		models.forEach(function(m) {
		  var option = document.createElement('option');
		  option.value = m.id;
		  option.textContent = m.id;
		  group.appendChild(option);
		});
		sel.appendChild(group);
	  }
	  appendGroup('热门', hotList);
	  Object.keys(groups).sort().forEach(function(p) { appendGroup(p, groups[p].filter(function(m) { return hot.indexOf(m.id) === -1; })); });
      onQSChange();
    }

    function initQS() {
      var sel = document.getElementById('qs-model-select');
      if (!sel) return;
      sel.innerHTML = '<option value="">加载中...</option>';
      onQSChange();
      AquaPlatform.loadModels(function(err, models) {
        if (err) {
          sel.innerHTML = '<option value="">加载失败: ' + err.message + '，<a href="javascript:initQS()" style="color:var(--accent-primary)">重试</a></option>';
          onQSChange();
          return;
        }
        qsModels = models;
        renderQSModels();
      });
    }
    // 删除原有的 DOMContentLoaded 自动调用（改为在 requireAuth 后显式调用 initQS，避免重复加载）

    function updateQSKeys() {
      var sel = document.getElementById('qs-key-select');
	  sel.innerHTML = '';
	  var placeholder = document.createElement('option');
	  placeholder.value = '';
	  placeholder.textContent = '选择密钥...';
	  sel.appendChild(placeholder);
      keysData.forEach(function(k) {
        if (k.status === 'active') {
		  var option = document.createElement('option');
		  option.value = k.id;
		  option.textContent = (k.key_prefix || 'sk-') + '•••• (' + (k.label || '默认') + ')';
		  sel.appendChild(option);
        }
      });
      onQSChange();
    }

    function onQSChange() {
      var k = document.getElementById('qs-key-select').value;
      var m = document.getElementById('qs-model-select').value;
      var btn = document.getElementById('qs-import-btn');
      if (!btn) return;
      // 按钮禁用条件：未选密钥、未选模型、模型处于加载中/加载失败状态
      btn.disabled = !k || !m || m === '加载中...' || m.indexOf('加载失败') === 0 || m === '模型加载失败，请刷新';
    }

    function openQuickImport() {
      var keyId = document.getElementById('qs-key-select').value;
      var model = document.getElementById('qs-model-select').value;
      var sw = document.getElementById('qs-sw-select').value;
      if (!keyId || !model) { Toast.warn('请先选择密钥和模型'); return; }

      API.get('/api/user/keys/' + keyId + '/reveal').then(function(data) {
        var apiKey = data.key || (data.data && data.data.key) || '';
        if (!apiKey) { Toast.error('获取密钥失败：返回数据为空'); return; }
        showQSModal(apiKey, model, sw);
      }).catch(function(err) { Toast.error(err.message || '获取密钥失败'); });
    }

    function showQSModal(apiKey, model, sw) {
      var HOST = 'api.example.com';
      var isCC = sw.indexOf('ccswitch') === 0;
      var bodyNode = document.createElement('div');
      var html = '';

      // 配置摘要
      html += '<div style="background:var(--bg-card);border-radius:6px;padding:10px;margin-bottom:14px;font-size:13px">';
	  html += '<div>模型: <code>'+escapeHtml(model)+'</code></div>';
      html += '</div>';

      if (isCC) {
        // CC Switch 一键导入
        var app = sw === 'ccswitch-codex' ? 'codex' : (sw === 'ccswitch-gemini' ? 'gemini' : 'claude');
        var appName = app === 'claude' ? 'Claude Code' : (app === 'codex' ? 'Codex' : 'Gemini CLI');
		var endpoint = app === 'codex' ? 'https://'+HOST+'/v1' : 'https://'+HOST;
		var importParams = {
          resource:'provider', app:app, name:'AQUA AI Gateway',
		  endpoint:endpoint, apiKey:apiKey, model:model
		};
		if (app === 'claude') {
		  importParams.haikuModel = model;
		  importParams.sonnetModel = model;
		  importParams.opusModel = model;
		}
		html += '<div>端点: <code>'+escapeHtml(endpoint)+'</code></div>';
		var link = 'ccswitch://v1/import?' + new URLSearchParams(importParams).toString();
        html += '<a class="btn btn-primary" href="'+link+'" style="display:block;text-align:center;padding:12px;text-decoration:none;font-size:14px">一键导入到 '+appName+'</a>';
        html += '<p class="text-xs text-secondary mt-8" style="text-align:center">点击按钮，CC Switch 将自动打开并导入配置</p>';
      } else if (sw === 'codex') {
        // Codex CLI 终端命令
        var cmd = 'mkdir -p ~/.codex\ncat > ~/.codex/auth.json << EOF\n{"OPENAI_API_KEY":"'+apiKey+'"}\nEOF\ncat > ~/.codex/config.toml << EOF\nmodel="'+model+'"\nmodel_provider="aqua"\n\n[model_providers.aqua]\nname="AQUA AI Gateway"\nbase_url="https://'+HOST+'/v1"\nwire_api="chat"\nEOF\n';
        html += '<pre class="code-block mono" style="font-size:12px;max-height:180px;overflow:auto">'+escapeHtml(cmd)+'</pre>';
        html += '<button class="btn btn-sm mt-8" onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent);Toast.success(\'已复制\')">复制命令</button>';
      } else if (sw === 'codebuddy' || sw === 'workbuddy') {
        // models.json
        var dir = sw === 'codebuddy' ? '.codebuddy' : '.workbuddy';
        var json = JSON.stringify({models:[{id:model,name:'AQUA AI - '+model,vendor:'OpenAI',url:'https://'+HOST+'/v1/chat/completions',apiKey:apiKey,maxInputTokens:200000,maxOutputTokens:8192}],availableModels:[model]}, null, 2);
        html += '<div class="text-xs text-secondary mb-4">保存到 ~/'+dir+'/models.json</div>';
        html += '<pre class="code-block mono" style="font-size:12px;max-height:200px;overflow:auto">'+escapeHtml(json)+'</pre>';
        html += '<button class="btn btn-sm mt-8" onclick="var b=new Blob([this.previousElementSibling.textContent],{type:\'text/plain\'});var a=document.createElement(\'a\');a.href=URL.createObjectURL(b);a.download=\'models.json\';a.click()">下载 models.json</button>';
      } else if (sw === 'astrbot') {
        // AstrBot 参数
        html += '<table class="data-table" style="font-size:13px">';
        html += '<tr><td>提供商类型</td><td>OpenAI</td></tr>';
        html += '<tr><td>API Base URL</td><td><code>https://'+HOST+'/v1</code></td></tr>';
        html += '<tr><td>API Key</td><td><code>'+escapeHtml(apiKey)+'</code></td></tr>';
        html += '<tr><td>模型</td><td><code>'+escapeHtml(model)+'</code></td></tr>';
        html += '</table>';
      }

      bodyNode.innerHTML = html;
      Modal.show({ title: '配置已生成', bodyNode: bodyNode, confirmText: '关闭', cancelText: null });
    }

    function renderKeys() {
      const tbody = document.getElementById('keys-tbody');
      if (!keysData.length) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><div class="empty-state-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.6 7.6a5 5 0 11-7.07 7.07A5 5 0 0111.4 11.6zm0 0L15 8m0 0l3 3m-3-3l3-3"/></svg></div><div class="empty-state-text">暂无密钥，点击右上角创建</div></div></td></tr>';
        return;
      }
      tbody.innerHTML = keysData.map(function (k) {
        const isActive = k.status === 'active';
        return '<tr>' +
          '<td class="mono">' + escapeHtml(k.key_prefix || '') + '••••</td>' +
          '<td>' + escapeHtml(k.label || '-') + '</td>' +
          '<td>' + Fmt.status(k.status) + '</td>' +
          '<td class="text-sm text-muted">' + Fmt.time(k.created_at) + '</td>' +
          '<td><div class="flex gap-8">' +
            '<button class="btn btn-sm" onclick="revealKey(\'' + escapeHtml(k.id) + '\')">查看</button>' +
            '<button class="btn btn-sm" onclick="copyKey(\'' + escapeHtml(k.id) + '\')">复制</button>' +
            '<button class="btn btn-sm ' + (isActive ? 'btn-warning' : 'btn-success') + '" onclick="toggleKey(\'' + escapeHtml(k.id) + '\')">' + (isActive ? '停用' : '启用') + '</button>' +
            '<button class="btn btn-sm btn-danger" onclick="deleteKey(\'' + escapeHtml(k.id) + '\')">删除</button>' +
          '</div></td>' +
          '</tr>';
      }).join('');
    }

    // 创建密钥
    function showCreateModal() {
      const bodyNode = document.createElement('div');
      bodyNode.innerHTML = '<div class="input-group"><label>备注（可选）</label><input type="text" class="input" id="key-label" placeholder="例如：生产环境密钥" maxlength="50"></div>';
      Modal.show({
        title: '创建 API 密钥',
        bodyNode: bodyNode,
        confirmText: '创建',
        onConfirm: function (modal) {
          const label = modal.querySelector('#key-label').value.trim() || 'default';
          return API.post('/api/user/keys', { label: label }).then(function (data) {
            Toast.success('密钥创建成功');
            loadKeys();
            // 延迟显示密钥结果Modal（等当前Modal关闭后）
            setTimeout(function () { showKeyResult(data.key); }, 100);
          }).catch(function (err) {
            Toast.error(err.message || '创建失败');
            throw err; // 继续抛出，让Modal保持打开状态
          });
        }
      });
    }

    function showKeyResult(key) {
      const bodyNode = document.createElement('div');
      bodyNode.innerHTML = '<p class="mb-16" style="color:var(--accent-warning);display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 22h20L12 2z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="18" r="0.5" fill="currentColor"/></svg> 密钥仅显示一次，请妥善保存！</p>' +
        '<pre class="code-block mono">' + escapeHtml(key) + '</pre>' +
        '<div class="mt-16"><button class="btn btn-primary btn-block" onclick="copyText(\'' + escapeHtml(key).replace(/'/g, "\\'") + '\')">复制密钥</button></div>';
      Modal.show({
        title: '密钥已创建',
        bodyNode: bodyNode,
        confirmText: '我已保存',
        cancelText: null,
      });
    }

    // 查看明文
    function revealKey(id) {
      API.get('/api/user/keys/' + id + '/reveal').then(function (data) {
        const bodyNode = document.createElement('div');
        bodyNode.innerHTML = '<p class="mb-16" style="color:var(--accent-warning);display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 22h20L12 2z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="18" r="0.5" fill="currentColor"/></svg> 请勿泄露此密钥</p>' +
          '<pre class="code-block mono">' + escapeHtml(data.key) + '</pre>';
        Modal.show({
          title: '密钥明文',
          bodyNode: bodyNode,
          confirmText: '复制',
          onConfirm: function () {
            copyText(data.key);
          }
        });
      }).catch(function (err) {
        Toast.error(err.message || '查看失败');
      });
    }

    // 复制密钥
    function copyKey(id) {
      API.get('/api/user/keys/' + id + '/reveal').then(function (data) {
        copyText(data.key);
      }).catch(function (err) {
        Toast.error(err.message || '复制失败');
      });
    }

    // 停用/启用
    function toggleKey(id) {
      API.put('/api/user/keys/' + id + '/toggle').then(function (data) {
        Toast.success(data.message || '操作成功');
        loadKeys();
      }).catch(function (err) {
        Toast.error(err.message || '操作失败');
      });
    }

    // 删除
    async function deleteKey(id) {
      const ok = await Modal.confirm('确定删除此密钥？删除后不可恢复。');
      if (!ok) return;
      API.del('/api/user/keys/' + id).then(function () {
        Toast.success('已删除');
        loadKeys();
      }).catch(function (err) {
        Toast.error(err.message || '删除失败');
      });
    }

    function copyText(text) {
      copyToClipboard(text).then(function (ok) {
        if (ok) Toast.success('已复制到剪贴板');
        else Toast.error('复制失败');
      });
    }
  </script>
</body>
</html>

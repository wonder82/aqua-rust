  <style>
    /* === 顶部工具栏 === */
    .cap-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 14px;
    }
    .cap-toolbar .input {
      flex: 1;
      min-width: 160px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
    }
    .cap-toolbar .input:focus { border-color: var(--accent-primary); }
    .cap-toolbar .select {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      min-width: 110px;
    }
    .cap-toolbar .select:focus { border-color: var(--accent-primary); }
    .cap-toolbar .cap-count-inline {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      margin-left: 4px;
    }

    /* 类型统计条 */
    .cap-type-strip {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .cap-type-chip {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      transition: all .15s;
      white-space: nowrap;
      user-select: none;
    }
    .cap-type-chip:hover { border-color: var(--accent-primary); }
    .cap-type-chip.active { background: var(--accent-primary); color: #000; border-color: var(--accent-primary); }
    .cap-type-chip .chip-num { opacity: .6; margin-left: 2px; }

    /* 能力标签筛选 */
    .cap-tag-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .cap-tag-btn {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-muted);
      transition: all .15s;
      white-space: nowrap;
      user-select: none;
    }
    .cap-tag-btn:hover { border-color: var(--accent-primary); color: var(--text-secondary); }
    .cap-tag-btn.active { background: var(--accent-success); color: #000; border-color: var(--accent-success); }
    .cap-tag-btn.reset-btn { margin-left: auto; color: var(--accent-danger); border-color: transparent; }
    .cap-tag-btn.reset-btn:hover { border-color: var(--accent-danger); }

    /* 卡片网格 - auto-fit 自适应列数，宽屏尽量排满 */
    .cap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      padding-bottom: 40px;
    }

    /* 紧凑卡片 */
    .cap-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      transition: border-color .15s, transform .1s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      position: relative;
    }
    .cap-card:hover { border-color: var(--accent-primary); transform: translateY(-1px); }
    .cap-card.deprecated { opacity: .55; }
    .cap-card.deprecated:hover { opacity: .7; }

    .cap-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 3px;
    }
    .cap-card-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      flex: 1;
      min-width: 0;
    }
    .cap-type-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .cap-type-dot.chat { background: var(--accent-primary); }
    .cap-type-dot.vision { background: #ab47bc; }
    .cap-type-dot.embedding { background: var(--accent-success); }
    .cap-type-dot.safety { background: var(--accent-danger); }
    .cap-type-dot.translation { background: #d4a017; }
    .cap-type-dot.code { background: #42a5f5; }
    .cap-type-dot.reasoning { background: var(--accent-warning); }

    .cap-card-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cap-card-sub span { white-space: nowrap; }

    .cap-card-caps {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }
    .cap-card-cap {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      font-weight: 500;
      white-space: nowrap;
    }
    .cap-card-cap.on { background: rgba(0,230,118,0.1); color: var(--accent-success); }
    .cap-card-cap.off { color: var(--text-muted); }

    /* 空状态 */
    .cap-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .cap-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    }
    @media (max-width: 768px) {
      .cap-toolbar { padding: 8px 10px; gap: 6px; }
      .cap-toolbar .input { font-size: 12px; padding: 6px 10px; }
      .cap-toolbar .select { font-size: 11px; padding: 6px 8px; min-width: 0; }
      .cap-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
      .cap-card { padding: 8px 10px; }
      .cap-card-name { font-size: 12px; }
      .cap-type-chip { font-size: 10px; padding: 3px 7px; }
      .cap-tag-btn { font-size: 10px; padding: 2px 7px; }
      .console-content h1 { font-size: 17px; }
      .navbar .btn-sm { font-size: 11px; padding: 4px 8px; }
      .brand-name { font-size: 16px; }
    }
    @media (max-width: 400px) {
      .cap-grid { grid-template-columns: 1fr; }
      .cap-toolbar .select { max-width: 100px; }
    }

  <script src="/static/js/platform.js?v=24.0"></script>
  <script>
    var _allModels = [], _filtered = [];
    var _activeType = '', _activeTags = [];

    requireAuth().then(function(p) {
      if (!p) {
        document.getElementById('cards-container').innerHTML = '<div class="cap-empty"><div class="empty-state-text">无法连接到 AQUA 服务，请检查网络连接后刷新页面重试</div></div>';
        return;
      }
      AquaPlatform.renderConsoleSidebar('capabilities');
      loadCapabilities();
    });

    var TYPE_NAMES = { chat:'对话', vision:'视觉', embedding:'嵌入', safety:'安全', translation:'翻译', code:'代码', reasoning:'推理' };
    var PRIORITY_PROVIDERS = ['acu', 'deepseek-ai', 'minimaxai', 'z-ai', 'moonshotai', 'stepfun-ai', '01-ai'];
    var PROVIDER_CN_NAMES = {
      '01': '零一万物', '01-ai': '零一万物', '01ai': '零一万物',
      'abacus': 'Abacus AI', 'abacusai': 'Abacus AI',
      'acu': 'AQUA自营', 'adept': 'Adept AI', 'ai21': 'AI21 Labs',
      'ai21labs': 'AI21 Labs', 'aisingapore': 'AI Singapore',
      'baai': '智源研究院', 'bigcode': 'BigCode 开源社区',
      'byte': '字节跳动 豆包', 'bytedance': '字节跳动 豆包',
      'databricks': 'Databricks', 'dbrx': 'Databricks DBRX',
      'deepseek-ai': '深度求索', 'ds': '深度求索',
      'goog': '谷歌 Google', 'google': '谷歌 Google',
      'ibm': 'IBM', 'meta': 'Meta 元宇宙',
      'microsoft': '微软 Microsoft', 'minimax': 'MiniMax 稀宇',
      'minimaxai': 'MiniMax 稀宇', 'mis': 'Mistral AI',
      'mistralai': 'Mistral AI', 'moon': '月之暗面 Kimi',
      'moonshotai': '月之暗面 Kimi', 'ms': '微软 Microsoft',
      'nv': '英伟达 NVIDIA', 'nv-mistralai': 'NVIDIA × Mistral',
      'nvidia': '英伟达 NVIDIA', 'nvm': 'NVIDIA × Mistral',
      'oai': 'OpenAI', 'openai': 'OpenAI',
      'pool': 'Poolside AI', 'poolside': 'Poolside AI',
      'qwen': '通义千问', 'sarvam': 'Sarvam AI', 'sarvamai': 'Sarvam AI',
      'sf': '阶跃星辰', 'sg': 'AI Singapore',
      'snow': 'Snowflake', 'snowflake': 'Snowflake',
      'step': '阶跃星辰', 'stepfun-ai': '阶跃星辰',
      'think': 'Thinking Machines', 'thinkingmachines': 'Thinking Machines',
      'upstage': 'Upstage AI', 'writer': 'Writer AI',
      'z-ai': '智谱 AI', 'zai': '智谱 AI', 'zyphra': 'Zyphra AI',
    };
    function getProviderName(p) { return PROVIDER_CN_NAMES[p] || p; }
    var LOCAL_EVIDENCE = {
      'minimaxai/minimax-m3': ['上游实测256K（官方声明1M）', '上游实测/官方声明'],
      'deepseek-ai/deepseek-v4-pro': ['256K', '上游实测/明确上限'],
      'deepseek-ai/deepseek-v4-flash': ['暂态过载，边界未完成', '独立审计状态'],
      'google/gemma-4-31b-it': ['至少1M', '至少通过']
    };
    var LOCAL_UNAVAILABLE = { 'moonshotai/kimi-k2.6': true };

    function modelId(value) {
      return String(value || '').trim().toLowerCase();
    }

    function modelRecord(raw, available) {
      var id = raw.model_id || raw.id || raw.model || '';
      if (!id) return null;
      var record = Object.assign({}, raw);
      record.model_id = id;
      record.display_name = record.display_name || record.name || id;
      record.publisher = record.publisher || record.owned_by || id.split('/')[0] || '未知';
      record.capabilities = Array.isArray(record.capabilities) ? record.capabilities : [];
      // 统一能力摘要字段：API 使用 snake_case，卡片渲染使用 canonical camelCase。
      // 不要让 API 返回的 context_length/max_output_tokens 被遗漏，进而显示为本地兜底摘要。
      if (record.totalContext == null) {
        record.totalContext = record.context_length != null ? record.context_length : (record.contextLength != null ? record.contextLength : 0);
      }
      if (record.maxOutput == null) {
        record.maxOutput = record.max_output_tokens != null ? record.max_output_tokens : (record.maxOutputTokens != null ? record.maxOutputTokens : 0);
      }
      var normalizedId = modelId(id);
      if (LOCAL_UNAVAILABLE[normalizedId]) available = false;
      record.availability = available;
      record.basic_available = available;
      record.evidence = record.evidence || LOCAL_EVIDENCE[normalizedId];
      record.evidence_status = record.evidence_status || (record.evidence ? record.evidence[1] : (available ? '基础可用' : '官方目录，基础不可用'));
      applyCanonicalLimits(record);
      return record;
    }

    function applyCanonicalLimits(model) {
      var normalizedId = modelId(model.model_id);
      if (normalizedId === 'deepseek-ai/deepseek-v4-pro') {
        model.totalContext = 256000;
        model.maxOutput = 32768;
        model.evidence = ['256K', '独立审计实测/明确上限'];
        model.evidence_status = '上游实测/明确上限';
      } else if (normalizedId === 'minimaxai/minimax-m3') {
        model.totalContext = 262144;
        model.evidence = ['上游实测256K（官方声明1M）', '上游实测/官方声明'];
        model.evidence_status = '上游实测/官方声明';
      } else if (normalizedId === 'deepseek-ai/deepseek-v4-flash') {
        model.totalContext = 0;
        model.maxOutput = 0;
        model.evidence = ['暂态过载，边界未完成', '独立审计状态'];
        model.evidence_status = '暂态过载，边界未完成';
      } else if (normalizedId === 'z-ai/glm-5.2') {
        model.totalContext = 202752;
        model.maxOutput = 16384;
        model.evidence = ['202752', '独立审计实测/明确上限'];
        model.evidence_status = '独立审计实测/明确上限';
      } else if (normalizedId === 'stepfun-ai/step-3.7-flash') {
        model.totalContext = 262144;
        model.evidence = ['256K', '上游实测/明确上限'];
        model.evidence_status = '上游实测/明确上限';
      } else if (normalizedId === 'moonshotai/kimi-k2.6') {
        model.basic_available = false;
        model.availability = false;
        model.evidence_status = 'NVIDIA 请求 404，不可用';
      }
      return model;
    }

    function mergeModelSources(capabilityData, officialData) {
      var capabilityModels = (capabilityData && capabilityData.models) || (capabilityData && capabilityData.capabilities && capabilityData.capabilities.models) || [];
      var officialModels = (officialData && officialData.data) || (Array.isArray(officialData) ? officialData : []);
      var byId = {};
      capabilityModels.forEach(function(raw) {
        var item = modelRecord(raw, raw.basic_available !== undefined ? !!raw.basic_available : true);
        if (item) byId[modelId(item.model_id)] = item;
      });
      officialModels.forEach(function(raw) {
        var id = modelId(raw.id || raw.model_id || raw.model);
        if (!id) return;
        if (byId[id]) {
          byId[id].official = true;
          byId[id].official_name = raw.name || raw.id;
          return;
        }
        var item = modelRecord(raw, false);
        if (item) {
          item.official = true;
          byId[id] = item;
        }
      });
      Object.keys(byId).forEach(function(k) {
        var item = byId[k];
        item.totalContext = item.totalContext || item.context_length || 0;
        item.maxOutput = item.maxOutput || item.max_output_tokens || 0;
        item.estimatedInput = item.estimatedInput || item.max_input_tokens || 0;
      });
      return Object.keys(byId).map(function(k) { return byId[k]; });
    }

    function loadCapabilities() {
      Promise.all([
        API.get('/api/user/model-capabilities'),
        API.get('/v1/models').catch(function() { return { data: [] }; })
      ]).then(function(results) {
        _allModels = mergeModelSources(results[0], results[1]);
        _filtered = _allModels;
        // 填充厂商下拉
        var pubs = {};
        _allModels.forEach(function(m) { var p = m.publisher || '未知'; pubs[p] = (pubs[p]||0)+1; });
        var sel = document.getElementById('publisher-filter');
        Object.keys(pubs).sort().forEach(function(p) {
          var o = document.createElement('option');
          o.value = p; o.textContent = getProviderName(p) + ' (' + pubs[p] + ')'; sel.appendChild(o);
        });
        render();
      }).catch(function() {
        document.getElementById('cards-container').innerHTML = '<div class="cap-empty"><div class="empty-state-text">加载失败，请稍后重试</div></div>';
        Toast.error('加载模型能力数据失败');
      });
    }

    function render() {
      updateChips();
      renderCards();
      document.getElementById('cap-count-header').textContent = _filtered.length + ' / ' + _allModels.length + ' 个模型';
      document.getElementById('filter-count').textContent = '显示 ' + _filtered.length + ' 个';
    }

    function updateChips() {
      var counts = {};
      _allModels.forEach(function(m) { var t = m.model_type || 'chat'; counts[t] = (counts[t]||0)+1; });
      var total = _allModels.length;
      document.getElementById('chip-all').textContent = '(' + total + ')';
      ['chat','vision','embedding','safety','translation','code','reasoning'].forEach(function(t) {
        var el = document.getElementById('chip-' + t);
        if (el) el.textContent = '(' + (counts[t]||0) + ')';
      });
    }

    function renderCards() {
      var container = document.getElementById('cards-container');
      if (_filtered.length === 0) {
        container.innerHTML = '<div class="cap-empty"><div class="empty-state-text">未找到匹配的模型</div></div>';
        return;
      }
      _filtered.sort(compareModels);
      var html = '';
      for (var i = 0; i < _filtered.length; i++) {
        html += renderCard(_filtered[i]);
      }
      container.innerHTML = html;
    }

    function compareModels(a, b) {
      var ap = PRIORITY_PROVIDERS.indexOf(modelId(a.model_id).split('/')[0]);
      var bp = PRIORITY_PROVIDERS.indexOf(modelId(b.model_id).split('/')[0]);
      ap = ap === -1 ? PRIORITY_PROVIDERS.length : ap;
      bp = bp === -1 ? PRIORITY_PROVIDERS.length : bp;
      if (ap !== bp) return ap - bp;
      var aa = a.basic_available !== false && a.availability !== false;
      var ba = b.basic_available !== false && b.availability !== false;
      if (aa !== ba) return aa ? -1 : 1;
      return String(a.model_id).localeCompare(String(b.model_id));
    }

    function renderCard(m) {
      var type = m.model_type || 'chat';
      var ctx = fmtCtx(m.totalContext);
      var maxOut = fmtCtx(m.maxOutput);
      var caps = m.capabilities || [];
      var url = '/console/capability-detail?model=' + encodeURIComponent(m.model_id);
      var cls = m.is_deprecated === true ? ' deprecated' : '';
      var normalizedModelId = modelId(m.model_id);
      var available = m.basic_available !== false && m.availability !== false;
      var availabilityLabel = normalizedModelId === 'moonshotai/kimi-k2.6' ? 'NVIDIA 请求 404，不可用' : (normalizedModelId === 'deepseek-ai/deepseek-v4-flash' ? '暂态过载，未判定永久不可用' : (available ? '基础可用' : '基础不可用'));
      // 图像/视频模型（gpt-image、qwen-image、sora 等）输出为图像/视频，无 token 上限概念
      var isImgModel = /(gpt-image|qwen-image|sora|video)/i.test(m.model_id);
      var summary = m.evidence && m.evidence[0] ? m.evidence[0] : (isImgModel ? '图像/视频' : (m.totalContext > 0 && m.maxOutput > 0 ? ctx + ' / ' + maxOut : '未测'));
      var welfareTags = (m.tags || []).filter(function (tag) { return tag === '公益' || tag === '众筹模型'; });
      var isAcuModel = normalizedModelId.indexOf('acu/') === 0;

      // 简洁能力点
      var capKeys = ['streaming','tools','vision','json_mode','reasoning','seed'];
      var capHTML = '';
      for (var c = 0; c < capKeys.length; c++) {
        var on = caps.indexOf(capKeys[c]) !== -1;
        capHTML += '<span class="cap-card-cap ' + (on ? 'on' : 'off') + '">' + (on ? '<span class="icon-ok">&#10003;</span>' : '·') + capKeys[c].charAt(0).toUpperCase() + '</span>';
      }

      return '<a href="' + url + '" class="cap-card' + cls + '">' +
        '<div class="cap-card-top">' +
          '<span class="cap-card-name">' + escapeHtml(m.display_name || m.model_id) + '</span>' +
          '<span class="cap-type-dot ' + type + '" title="' + (TYPE_NAMES[type]||type) + '"></span>' +
        '</div>' +
        '<div class="cap-card-sub">' +
          '<span>' + escapeHtml(getProviderName(m.publisher) || '') + '</span>' +
          '<span>' + escapeHtml(summary) + '</span>' +
          '<span style="color:' + (available ? 'var(--accent-success)' : 'var(--accent-danger)') + '">' + availabilityLabel + '</span>' +
          (m.evidence_status ? '<span>' + escapeHtml(m.evidence_status) + '</span>' : '') +
          (isAcuModel ? '<span style="color:#3b82f6;font-weight:600">官方自营</span>' : '') +
          welfareTags.map(function (tag) { return '<span class="welfare-tag">' + escapeHtml(tag) + '</span>'; }).join('') +
          (m.is_deprecated === true ? '<span style="color:var(--accent-danger)">已弃用</span>' : '') +
        '</div>' +
        '<div class="cap-card-caps">' + capHTML + '</div>' +
      '</a>';
    }

    function fmtCtx(v) {
      if (!v || Number(v) <= 0) return '未测';
      if (v >= 1000000) return (v/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
      if (v >= 1024) return Math.round(v/1024) + 'K';
      return String(v);
    }

    // ========== 过滤 ==========

    function applyFilters() {
      var search = document.getElementById('search-input').value.toLowerCase().trim();
      var publisher = document.getElementById('publisher-filter').value;

      _filtered = _allModels.filter(function(m) {
        if (search) {
          var n = (m.display_name||'').toLowerCase(), id = (m.model_id||'').toLowerCase(), p = (m.publisher||'').toLowerCase();
          if (n.indexOf(search)===-1 && id.indexOf(search)===-1 && p.indexOf(search)===-1) return false;
        }
        if (publisher && m.publisher !== publisher) return false;
        if (_activeType && m.model_type !== _activeType) return false;
        if (_activeTags.length > 0) {
          var caps = m.capabilities || [];
          for (var i = 0; i < _activeTags.length; i++) {
            if (caps.indexOf(_activeTags[i]) === -1) return false;
          }
        }
        return true;
      });
      render();
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('publisher-filter').value = '';
      _activeType = '';
      _activeTags = [];
      document.querySelectorAll('.cap-type-chip').forEach(function(el) { el.classList.remove('active'); });
      document.querySelector('.cap-type-chip[data-type=""]').classList.add('active');
      document.querySelectorAll('.cap-tag-btn').forEach(function(el) { el.classList.remove('active'); });
      _filtered = _allModels;
      render();
    }

    // 类型条点击
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('type-strip').addEventListener('click', function(e) {
        var chip = e.target.closest('.cap-type-chip');
        if (!chip) return;
        document.querySelectorAll('.cap-type-chip').forEach(function(el) { el.classList.remove('active'); });
        chip.classList.add('active');
        _activeType = chip.getAttribute('data-type') || '';
        applyFilters();
      });

      // 能力标签点击
      document.getElementById('tag-row').addEventListener('click', function(e) {
        var btn = e.target.closest('.cap-tag-btn');
        if (!btn || btn.classList.contains('reset-btn')) return;
        var cap = btn.getAttribute('data-cap');
        if (!cap) return;
        btn.classList.toggle('active');
        _activeTags = [];
        document.querySelectorAll('.cap-tag-btn.active').forEach(function(el) {
          var c = el.getAttribute('data-cap');
          if (c) _activeTags.push(c);
        });
        applyFilters();
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>赞助支持 - AQUA 公益AI</title>
  <link rel="stylesheet" href="/static/css/platform.css?v=24.0">
  <style>
    /* 收款码卡片 */
    .qr-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 20px; text-align: center;
      transition: transform .2s, border-color .2s;
    }
    .qr-card:hover { transform: translateY(-2px); border-color: var(--accent-primary); }
    .qr-card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .qr-card img { max-width: 200px; width: 100%; border-radius: var(--radius-md); cursor: zoom-in; display: block; margin: 0 auto; }
    .qr-card-desc { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
    /* 大图遮罩 */
    .qr-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex;
      align-items: center; justify-content: center; z-index: 2000; padding: 20px; cursor: zoom-out;
    }
    .qr-overlay img { max-width: 90vw; max-height: 90vh; border-radius: var(--radius-md); }
    /* 资金用途进度条 */
    .fund-row { margin-bottom: 16px; }
    .fund-row:last-child { margin-bottom: 0; }
    .fund-bar { height: 8px; border-radius: 4px; background: var(--bg-input); overflow: hidden; margin-top: 8px; }
    .fund-bar-fill { height: 100%; background: var(--accent-primary); }
    /* 赞助方卡片 */
    .sponsor-card {
      display: flex; align-items: center; gap: 16px; padding: 16px;
      border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      text-decoration: none; color: var(--text-primary); transition: transform .2s, border-color .2s;
    }
    .sponsor-card:hover { transform: translateY(-2px); border-color: var(--accent-primary); text-decoration: none; }
    .sponsor-card img { max-height: 56px; }
    .sponsor-card .sponsor-name { font-size: 16px; font-weight: 600; }
    .sponsor-card .sponsor-desc { font-size: 13px; color: var(--text-secondary); }
    /* 免责声明 */
    .disclaimer { padding-left: 20px; }
    .disclaimer li { margin-bottom: 6px; color: var(--text-secondary); font-size: 13px; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="hero" style="padding:40px 20px">
      <h1 class="hero-title">支持 AQUA 公益AI平台</h1>
      <p class="hero-subtitle">你的每一份心意，都是让公益AI持续运转的动力</p>
    </div>

    <!-- 收款码（并排展示，点击放大） -->
    <div class="grid grid-2 mb-24">
      <div class="qr-card">
        <div class="qr-card-title">微信赞赏</div>
        <img src="/static/images/sponsor/wechat_reward.jpg?v=20260730" alt="微信赞赏码" onclick="enlargeQR(this)">
        <div class="qr-card-desc">扫码微信赞赏</div>
      </div>
      <div class="qr-card">
        <div class="qr-card-title">支付宝</div>
        <img src="/static/images/sponsor/alipay.jpg?v=20260725" alt="支付宝收款码" onclick="enlargeQR(this)">
        <div class="qr-card-desc">扫码支付宝</div>
      </div>
    </div>

    <!-- 资金用途说明 -->
    <div class="card mb-24">
      <div class="card-title">资金用途说明</div>
      <div class="fund-row">
        <div class="flex justify-between items-center">
          <span class="text-sm">项目运营与维护</span>
          <span class="text-sm" style="color:var(--accent-primary)">65%</span>
        </div>
        <div class="fund-bar"><div class="fund-bar-fill" style="width:65%"></div></div>
      </div>
      <div class="fund-row">
        <div class="flex justify-between items-center">
          <span class="text-sm">服务器与带宽</span>
          <span class="text-sm" style="color:var(--accent-primary)">35%</span>
        </div>
        <div class="fund-bar"><div class="fund-bar-fill" style="width:35%"></div></div>
      </div>
    </div>

    <!-- 免责声明 -->
    <div class="card mb-24">
      <div class="card-title">免责声明</div>
      <ul class="disclaimer">
        <li>赞助纯属自愿行为，不构成对 AQUA 平台任何服务的承诺或保障。</li>
        <li>赞助款项将用于平台运营与维护，一经赞助原则上不予退还。</li>
        <li>赞助不会获得任何形式的特殊待遇、优先权或服务等级提升。</li>
        <li>赞助方的观点与立场不代表 AQUA 平台的观点与立场。</li>
      </ul>
    </div>



  <div id="footer"></div>

  <script src="/static/js/platform.js?v=24.0"></script>
  <script>
    // 登录态感知导航：已登录显示 控制台/退出
    AquaPlatform.mountPublicNavbar('sponsor');
    document.getElementById('footer').innerHTML = AquaPlatform.renderFooter();

    // 点击收款码弹出大图遮罩，点击遮罩关闭
    function enlargeQR(img) {
      const overlay = document.createElement('div');
      overlay.className = 'qr-overlay';
      const big = document.createElement('img');
      big.src = img.src;
      big.alt = img.alt;
      overlay.appendChild(big);
      overlay.addEventListener('click', function () { overlay.remove(); });
      document.body.appendChild(overlay);
    }
  </script>
</body>
</html>

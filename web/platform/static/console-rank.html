<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>用量排行榜 - AQUA AI</title>
  <link rel="stylesheet" href="/static/css/platform.css?v=24.0">
  <style>
    .rk-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
    .rk-tabs { display:flex; gap:8px; }
    .rk-tab { padding:6px 16px; border:1px solid var(--border-color); border-radius:var(--radius-md); background:var(--bg-card); color:var(--text-secondary); font-size:13px; cursor:pointer; transition:all .2s; }
    .rk-tab.active { border-color:var(--accent-primary); color:var(--accent-primary); background:rgba(74,144,217,.08); }
    .rk-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
    .rk-sum-card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:16px; text-align:center; }
    .rk-sum-val { font-size:22px; font-weight:700; color:var(--accent-primary); }
    .rk-sum-lbl { font-size:12px; color:var(--text-muted); margin-top:4px; }
    .rk-refresh-info { font-size:12px; color:var(--text-muted); text-align:right; line-height:1.8; }
    .rk-table { width:100%; border-collapse:collapse; font-size:13px; }
    .rk-table th { background:var(--bg-secondary); color:var(--text-secondary); font-weight:600; padding:10px 12px; text-align:left; border-bottom:1px solid var(--border-color); white-space:nowrap; }
    .rk-table td { padding:11px 12px; border-bottom:1px solid var(--border-color); color:var(--text-primary); }
    .rk-table tbody tr:hover { background:var(--bg-secondary); }
    .rk-rank { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px; font-weight:700; font-size:13px; }
    .rk-rank.gold { background:linear-gradient(135deg,#ffd700,#f0b400); color:#fff; }
    .rk-rank.silver { background:linear-gradient(135deg,#c0c0c0,#a8a8a8); color:#fff; }
    .rk-rank.bronze { background:linear-gradient(135deg,#cd7f32,#b06b28); color:#fff; }
    .rk-rank.plain { background:var(--bg-secondary); color:var(--text-secondary); }
    .rk-user { font-weight:600; }
    .rk-self { color:var(--accent-primary); font-size:11px; border:1px solid var(--accent-primary); border-radius:4px; padding:0 5px; margin-left:6px; white-space:nowrap; }
    .rk-score { font-weight:700; color:var(--accent-primary); }
    .rk-crown { font-size:15px; }
    .rk-refresh-bar { margin-bottom:16px; }
    .rk-note { font-size:12px; color:var(--text-muted); margin-top:12px; line-height:1.7; }
  </style>
  <link rel="stylesheet" href="/static/css/icons.css?v=1.0">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand"><a href="/" class="brand-logo"><span class="brand-name">AQUA</span><span class="brand-tag">AI</span></a></div>
      <div class="navbar-actions">
        <button class="icon-btn" data-theme-toggle title="切换主题" onclick="Theme.toggle()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
        <a href="/" class="btn btn-sm">回首页</a>
      </div>
    </div>
  </nav>

  <div class="console-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="console-content">
      <div class="rk-header">
        <h1 style="margin:0"><span class="icon-svg icon-trophy"><svg viewBox="0 0 24 24"><path d="M6 3h12v4a4 4 0 01-4 4h-4a4 4 0 01-4-4V3z"/><path d="M6 7H4a2 2 0 010-4h2"/><path d="M18 7h2a2 2 0 100-4h-2"/><rect x="8" y="11" width="8" height="2" rx="1"/><rect x="10" y="13" width="4" height="8" rx="1"/></svg></span> 用量排行榜</h1>
        <div class="rk-tabs">
          <button class="rk-tab active" data-range="7d" onclick="switchRange('7d',this)">近 7 天</button>
          <button class="rk-tab" data-range="today" onclick="switchRange('today',this)">今日</button>
        </div>
      </div>

      <!-- 汇总 -->
      <div class="rk-summary">
        <div class="rk-sum-card"><div class="rk-sum-val" id="sum-users">-</div><div class="rk-sum-lbl">上榜用户</div></div>
        <div class="rk-sum-card"><div class="rk-sum-val" id="sum-req">-</div><div class="rk-sum-lbl">统计请求数</div></div>
        <div class="rk-sum-card"><div class="rk-sum-val" id="sum-tok">-</div><div class="rk-sum-lbl">统计 Token</div></div>
      </div>

      <!-- 刷新信息 -->
      <div class="rk-refresh-bar">
        <div class="rk-refresh-info" id="refresh-info">加载中...</div>
      </div>

      <!-- 排行榜 -->
      <div class="card">
        <div class="card-title">前 20 名 · 综合评分 = 请求量 35% + Token 35% + 成功率 20% + 活跃天数 10%</div>
        <div class="table-wrap">
          <table class="rk-table">
            <thead><tr><th>排名</th><th>用户</th><th>综合分</th><th>请求数</th><th>Token 数</th><th>成功率</th><th>活跃天数</th><th>平均延迟</th></tr></thead>
            <tbody id="board-tbody">
              <tr><td colspan="8" class="text-center text-muted">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="rk-note">
        · 排行榜基于网关真实请求日志实时统计，综合评分综合请求量、Token 消耗、成功率与活跃天数。<br>
        · 榜单每 60 秒自动刷新，并每日 00:00 与 12:00 整点重新结算；用户名为隐私脱敏显示。<br>
        · 参与统计的数据范围取决于当前选择的"今日 / 近 7 天"。
      </div>
    </div>
  </div>

  <script src="/static/js/platform.js?v=24.0"></script>
  <script>
    var _range = '7d';
    var _timer = null;

    requireAuth().then(function (profile) {
      if (!profile) { var _cc = document.querySelector('.console-content'); if (_cc) _cc.innerHTML = '<div style="padding:60px 20px;text-align:center"><p style="font-size:16px;margin-bottom:16px;color:var(--text-secondary)">连接服务失败，请刷新页面重试</p><button onclick="location.reload()" style="padding:8px 24px;border:1px solid var(--accent-primary);background:transparent;color:var(--accent-primary);border-radius:6px;cursor:pointer">刷新重试</button></div>'; return; }
      window.__rkProfile = profile;
      AquaPlatform.renderConsoleSidebar('rank');
      loadBoard();
      _timer = setInterval(function () { if (document.visibilityState !== 'hidden') loadBoard(); }, 60000);
      // 整点（00:00 / 12:00）强制刷新
      setInterval(function () {
        var h = new Date().getHours();
        if (h === 0 || h === 12) loadBoard();
      }, 60000);
    });

    function switchRange(r, el) {
      if (r === _range) return;
      _range = r;
      document.querySelectorAll('.rk-tab').forEach(function (b) { b.classList.remove('active'); });
      if (el) el.classList.add('active');
      loadBoard();
    }

    function loadBoard() {
      API.get('/api/user/leaderboard?limit=20&range=' + _range).then(function (d) {
        var board = d.leaderboard || [];
        renderBoard(board);
        // 汇总
        document.getElementById('sum-users').textContent = Fmt.number(board.length);
        var req = 0, tok = 0;
        board.forEach(function (u) { req += u.total_requests || 0; tok += u.total_tokens || 0; });
        document.getElementById('sum-req').textContent = Fmt.number(req);
        document.getElementById('sum-tok').textContent = Fmt.number(tok);
        // 刷新信息
        var info = document.getElementById('refresh-info');
        var next = d.next_refresh_at ? new Date(d.next_refresh_at * 1000) : null;
        var last = d.refreshed_at ? new Date(d.refreshed_at * 1000) : null;
        info.innerHTML = '统计范围: <b>' + (d.range === 'today' ? '今日' : '近 7 天') + '</b> &nbsp;·&nbsp; 数据刷新: ' +
          (last ? last.toLocaleString('zh-CN', { hour12: false }) : '-') +
          (next ? ' &nbsp;·&nbsp; 下次整点结算: ' + next.toLocaleString('zh-CN', { hour12: false }) : '');
      }).catch(function () {
        document.getElementById('board-tbody').innerHTML = '<tr><td colspan="8" class="text-center text-muted">加载失败</td></tr>';
      });
    }

    function renderBoard(board) {
      var myId = (window.__rkProfile && window.__rkProfile.user_id) || null;
      var tbody = document.getElementById('board-tbody');
      if (!board.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">暂无数据</td></tr>';
        return;
      }
      var html = '';
      board.forEach(function (u, i) {
        var rank = i + 1;
        var rankHtml;
        if (rank === 1) rankHtml = '<span class="rk-rank gold rk-crown"><span class="icon-svg icon-crown"><svg viewBox="0 0 24 24"><path d="M2 8l3 8h14l3-8"/><path d="M5 8l3-5 4 4 4-4 3 5"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg></span></span>';
        else if (rank === 2) rankHtml = '<span class="rk-rank silver">2</span>';
        else if (rank === 3) rankHtml = '<span class="rk-rank bronze">3</span>';
        else rankHtml = '<span class="rk-rank plain">' + rank + '</span>';
        var self = (myId !== null && u.user_id === myId) ? '<span class="rk-self">我</span>' : '';
        html += '<tr>' +
          '<td>' + rankHtml + '</td>' +
          '<td><span class="rk-user">' + escapeHtml(u.username) + '</span>' + self + '</td>' +
          '<td><span class="rk-score">' + Number(u.score || 0).toFixed(2) + '</span></td>' +
          '<td>' + Fmt.number(u.total_requests || 0) + '</td>' +
          '<td>' + Fmt.number(u.total_tokens || 0) + '</td>' +
          '<td>' + (u.success_rate != null ? u.success_rate + '%' : '-') + '</td>' +
          '<td>' + (u.active_days || 0) + ' 天</td>' +
          '<td>' + Fmt.latency(u.avg_latency_ms || 0) + '</td>' +
          '</tr>';
      });
      tbody.innerHTML = html;
    }
  </script>
</body>
</html>

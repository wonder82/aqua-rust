<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>登录 - JHRY公益</title>
  <link rel="stylesheet" href="/static/css/platform.css?v=24.0">
  <link rel="stylesheet" href="/static/css/icons.css?v=1.0">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-title">登录 JHRY公益</div>
      <div class="auth-subtitle">登录后即可使用所有 AI 模型</div>

      <form id="login-form" onsubmit="return doLogin(event)">
        <div class="input-group">
          <label>用户名</label>
          <input type="text" class="input" id="username" name="username" placeholder="输入用户名" required autocomplete="username">
        </div>
        <div class="input-group">
          <label>密码</label>
          <input type="password" class="input" id="password" name="password" placeholder="输入密码" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">登录</button>
      </form>

      <div class="auth-subtitle" style="margin-top:16px;font-size:13px">
        账号由管理员统一分配，如需开通请联系管理员
      </div>

      <div style="margin-top:24px;text-align:center">
        <a href="/" class="text-sm text-muted">← 返回首页</a>
      </div>
    </div>
  </div>



  <script src="/static/js/platform.js?v=24.0"></script>
  <script src="/static/js/fingerprint.js?v=1.0"></script>
  <script>
    // 初始化设备指纹采集
    AQUAFingerprint.init();

    // 校验 redirect 参数，防止开放重定向：必须以单个 / 开头且非 //
    function getSafeRedirect() {
      var redirect = new URLSearchParams(location.search).get('redirect') || '/console';
      if (!redirect.startsWith('/') || redirect.startsWith('//')) {
        redirect = '/console';
      }
      return redirect;
    }

    // 已登录则跳转控制台（优先使用 redirect 参数）
    API.get('/api/user/profile').then(function () {
      window.location.href = getSafeRedirect();
    }).catch(function () { /* 未登录，停留在登录页 */ });

    function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { Toast.warn('请填写用户名和密码'); return false; }

      btn.disabled = true;
      btn.textContent = '登录中...';
      // 邮箱与用户名区分提交：含 @ 走 email 字段，否则走 username 字段
      var payload = username.indexOf('@') !== -1
        ? { email: username, password: password }
        : { username: username, password: password };
      API.post('/api/auth/login', payload).then(function (data) {
        Toast.success('登录成功');
        var redirect = getSafeRedirect();
        // 先验证 Cookie 是否生效，再跳转
        setTimeout(async function () {
          try {
            var resp = await fetch('/api/user/profile', { credentials: 'same-origin' });
            if (resp.ok) {
              window.location.href = redirect;
            } else {
              // Cookie 可能尚未生效，延迟后重试一次
              setTimeout(function () { window.location.href = redirect; }, 500);
            }
          } catch (e) {
            window.location.href = redirect;
          }
        }, 300);
      }).catch(function (err) {
        Toast.error(err.message || '登录失败');
        btn.disabled = false;
        btn.textContent = '登录';
      });
      return false;
    }
  </script>
</body>
</html>

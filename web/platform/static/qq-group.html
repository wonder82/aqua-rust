  <title>QQ交流群 - AQUA 公益AI</title>
  <link rel="stylesheet" href="/static/css/platform.css?v=24.0">
  <style>
    .qq-page { max-width: 800px; margin: 0 auto; padding: 40px 20px 60px; }
    .qq-page h1 { text-align: center; margin-bottom: 8px; font-size: 28px; }
    .qq-page .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 40px; }
    .qq-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); text-decoration: none; margin-bottom: 24px; transition: color .15s; }
    .qq-back:hover { color: var(--accent-primary); }
    .qq-grid { display: grid; gap: 20px; }
    .qq-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; transition: border-color .2s, box-shadow .2s; }
    .qq-card:hover { border-color: rgba(18,183,245,.3); box-shadow: 0 4px 16px rgba(18,183,245,.08); }
    .qq-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .qq-card-icon { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg,#12b7f5,#00a6e0); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .qq-card-icon svg { width: 24px; height: 24px; fill: #fff; }
    .qq-card-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
    .qq-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .qq-card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
    .qq-card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .qq-card-tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: rgba(18,183,245,.08); color: #12b7f5; border: 1px solid rgba(18,183,245,.15); }
    .qq-join-btn { display: block; text-align: center; padding: 12px 24px; background: linear-gradient(135deg,#12b7f5,#00a6e0); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; transition: transform .15s, box-shadow .15s; }
    .qq-join-btn:hover { transform: scale(1.02); box-shadow: 0 4px 12px rgba(18,183,245,.3); }
    @media (max-width: 600px) {
      .qq-page h1 { font-size: 22px; }
      .qq-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <div class="qq-page">
    <a href="/" class="qq-back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg> 返回首页</a>
    <h1>官方QQ交流群</h1>
    <p class="subtitle">加入 AQUA 社区，获取最新动态、技术交流与问题解答</p>
    <div class="qq-grid" id="qq-grid">
      <!-- JS 动态渲染 -->
    </div>
  </div>
  <div id="footer"></div>
  <script src="/static/js/platform.js?v=24.0"></script>
  <script>
    AquaPlatform.mountPublicNavbar('qq-group');
    document.getElementById('footer').innerHTML = AquaPlatform.renderFooter();

    var QQ_GROUPS = [{
      name: 'AQUA开源项目交流群',
      id: '1103667832',
      link: 'https://qm.qq.com/q/XJU6d5cScK',
      max: 1000,
      desc: 'AQUA 公益API项目官方交流群，讨论模型使用、API接入、项目开发等技术话题。欢迎所有用户加入！',
      tags: ['官方群', '技术交流', '问题反馈', '版本更新']
    }];

    function renderGroups() {
      var html = '';
      QQ_GROUPS.forEach(function(g) {
        html += '<div class="qq-card">' +
          '<div class="qq-card-header">' +
            '<div class="qq-card-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-4h2v-2h-2v2zm0-4h2V7h-2v5z"/></svg></div>' +
            '<div>' +
              '<div class="qq-card-title">' + esc(g.name) + '</div>' +
              '<div class="qq-card-meta">群号：' + esc(g.id) + ' · ' + g.max + '人上限</div>' +
            '</div>' +
          '</div>' +
          '<div class="qq-card-desc">' + esc(g.desc) + '</div>' +
          '<div class="qq-card-tags">' + g.tags.map(function(t) { return '<span class="qq-card-tag">' + esc(t) + '</span>'; }).join('') + '</div>' +
          '<a href="' + esc(g.link) + '" target="_blank" rel="noopener" class="qq-join-btn">点击加入群聊</a>' +
        '</div>';
      });
      document.getElementById('qq-grid').innerHTML = html;
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    renderGroups();
  </script>
</body>
</html>

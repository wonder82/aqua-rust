<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUA Gateway 管理控制台</title>
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --card:#ffffff;
  --primary:#4a90d9; --primary-dim:#3a7bc8;
  --text:#1a1a2e; --text2:#4a4a6a; --text3:#8888a8;
  --success:#34c759; --warn:#f0a500; --danger:#e74c3c;
  --border:#e0e4ea; --border2:#d0d4da; --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#d0d4da;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#b0b4ba}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.btn{padding:6px 14px;border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);border:1px solid var(--border);transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#3a7bc8;color:#fff}
.btn-danger{color:var(--danger);border-color:#f0d0d0}
.btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-sm{padding:3px 8px;font-size:12px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn-ghost:hover{color:var(--primary);background:var(--surface)}
.input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;width:100%;transition:.15s}
.input:focus,select:focus{border-color:var(--primary)}
label{display:block;margin-bottom:4px;color:var(--text2);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;line-height:1.4}
.badge-active{background:rgba(52,199,89,.15);color:var(--success)}
.badge-inactive{background:rgba(138,143,154,.15);color:var(--text2)}
.badge-frozen{background:rgba(255,149,0,.15);color:var(--warn)}
.badge-cooling{background:rgba(255,149,0,.15);color:var(--warn)}
.badge-banned{background:rgba(255,59,48,.15);color:var(--danger)}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:left;white-space:nowrap}
thead th{background:var(--surface);color:var(--text2);font-weight:500;border-bottom:1px solid var(--border);position:sticky;top:0;cursor:pointer;user-select:none}
thead th:hover{color:var(--text)}
tbody tr{border-bottom:1px solid var(--border2)}
tbody tr:hover{background:rgba(64,153,255,.04)}
td.actions{display:flex;gap:4px;align-items:center}
.empty{text-align:center;padding:40px;color:var(--text3)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-title{font-size:13px;color:var(--text2);margin-bottom:6px}
.card-value{font-size:24px;font-weight:600}
.card-value.danger{color:var(--danger)}
.card-value.warn{color:var(--warn)}
.card-value.success{color:var(--success)}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#login-view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#e8eef5 0%,var(--bg) 60%)}
.login-box{width:340px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.login-box h1{font-size:20px;margin-bottom:4px}
.login-box .sub{color:var(--text2);font-size:13px;margin-bottom:24px}
.login-box .logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#2b5fd9);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;margin-bottom:16px;color:#fff}
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-head{padding:18px 16px;border-bottom:1px solid var(--border)}
.sidebar-head .brand{font-size:16px;font-weight:600}
.sidebar-head .brand-sub{font-size:11px;color:var(--text3);margin-top:2px}
.nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--text2);cursor:pointer;border-left:2px solid transparent;transition:.15s;font-size:13px}
.nav-item:hover{color:var(--text);background:var(--card)}
.nav-item.active{color:var(--primary);border-left-color:var(--primary);background:rgba(64,153,255,.06)}
.nav-item .ic{width:16px;text-align:center;opacity:.9}
.sidebar-foot{padding:10px 16px;border-top:1px solid var(--border)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.topbar h2{font-size:15px;font-weight:500}
.content{flex:1;overflow-y:auto;padding:20px;position:relative}
.hamburger{display:none;font-size:22px;background:none;color:var(--text);padding:0 4px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:10px;width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.modal.wide{max-width:720px}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-head h3{font-size:15px;font-weight:500}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.modal .close{position:absolute;top:12px;right:14px;background:none;color:var(--text2);font-size:20px}
.form-row{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#toast-wrap{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--primary);padding:10px 16px;border-radius:6px;min-width:220px;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:slidein .2s;font-size:13px}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:12px 0;color:var(--text2);font-size:13px;flex-wrap:wrap}
.pager button{min-width:30px;height:30px;padding:0 8px;background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:6px}
.pager button:hover{border-color:var(--primary);color:var(--primary)}
.pager button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;padding:8px 0;border-bottom:1px solid var(--border)}
.chart .bar{flex:1;min-width:6px;background:linear-gradient(180deg,var(--primary),var(--primary-dim));border-radius:3px 3px 0 0;position:relative;transition:.2s;cursor:pointer;min-height:1px}
.chart .bar:hover{filter:brightness(1.3)}
.chart-axis{display:flex;justify-content:space-between;color:var(--text3);font-size:10px;margin-top:4px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot-ok{background:var(--success);box-shadow:0 0 6px var(--success)}
.dot-warn{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.dot-err{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border2);font-size:13px}
.kv .k{color:var(--text2)}
.kv .v{font-weight:500}
.switch{position:relative;width:40px;height:22px;background:var(--border);border-radius:11px;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--success)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:20px}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.4)}
  .sidebar.open{transform:none}
  .hamburger{display:block}
  .content{padding:14px}
  .grid-stats{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  th,td{padding:7px 8px}
}
</style>
</head>
<body>
<div id="login-view" class="hidden">
  <div class="login-box">
    <div class="logo">A</div>
    <h1>AQUA Gateway</h1>
    <div class="sub">v11.0 管理控制台</div>
    <form id="login-form">
      <div class="form-row"><label>管理员密码</label><input type="password" id="login-password" class="input" placeholder="请输入密码" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:9px">登录</button>
    </form>
  </div>
</div>
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head"><div class="brand">网关管理</div><div class="brand-sub">AQUA Gateway v11.0</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" style="display:flex;flex-direction:column;gap:4px">
    <a href="/" class="btn btn-sm" style="width:100%">回平台首页</a>
    <button class="btn btn-sm" style="width:100%;margin-top:4px" onclick="logout()">退出登录</button>
  </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="hamburger" onclick="toggleSidebar()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h2 id="page-title">仪表盘</h2>
      <div class="spacer"></div>
      <span class="tag" id="maint-tag"></span>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="toast-wrap"></div>
<div id="modal-root"></div>
<script>
"use strict";
var API_BASE="/gw/admin", TOKEN_KEY="aqua_admin_token", CSRF_KEY="aqua_admin_csrf";
/* 安全存储：localStorage 不可用（隐私模式/禁用存储）时回退内存，避免顶层抛错导致白屏 */
var _memStore={};
function sGet(k){try{var v=localStorage.getItem(k);return v!=null?v:_memStore[k]||null;}catch(e){return _memStore[k]||null;}}
function sSet(k,v){_memStore[k]=v;try{localStorage.setItem(k,v);}catch(e){}}
function sDel(k){delete _memStore[k];try{localStorage.removeItem(k);}catch(e){}}
var state={page:"dashboard",token:sGet(TOKEN_KEY)||"",csrf:sGet(CSRF_KEY)||"",
  upstreamPage:1,upstreamPageSize:15,upstreamSort:{key:"name",dir:1},upstreamData:[],
  clientPage:1,clientPageSize:15,
  logPage:1,logPageSize:20,logFilter:{q:"",code:"",model:"",path:""},logData:[],settings:{},selectedClient:null};
var NAV=[
  {id:"dashboard",name:"仪表盘",ic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>'},
  {id:"upstreams",name:"上游密钥",ic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.6 7.6a5 5 0 11-7.07 7.07A5 5 0 0111.4 11.6zm0 0L15 8m0 0l3 3m-3-3l3-3"/></svg>'},
  {id:"clients",name:"客户端管理",ic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>'},
  {id:"logs",name:"请求日志",ic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/></svg>'},
  {id:"settings",name:"系统配置",ic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'},
  {id:"monitor",name:"系统监控",ic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>'},
  {id:"mail",name:"邮件管理",ic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>'}
];
function $(s,p){return (p||document).querySelector(s);}
function el(t,a,h){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else if(k==="style")e.setAttribute("style",a[k]);else e.setAttribute(k,a[k]);}if(h!=null)e.innerHTML=h;return e;}
function esc(s){if(s==null)return "";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtNum(n){if(n==null||isNaN(n))return "-";n=Number(n);if(n>=1e6)return (n/1e6).toFixed(2)+"M";if(n>=1e3)return (n/1e3).toFixed(1)+"k";return String(n);}
function formatLatency(ms){ms=Number(ms)||0;if(ms>=1000)return (ms/1000).toFixed(2)+' s';if(ms>=100)return Math.round(ms)+' ms';return ms.toFixed(2)+' ms';}
function pad(n){return n<10?"0"+n:n;}
function fmtTime(t){if(!t)return "-";var d=new Date(t);if(isNaN(d))return String(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}
function pct(a,b){if(!b)return 0;return Math.round(a/b*1000)/10;}
function rateBadge(r){var c=r>=95?"success":r>=80?"warn":"danger";return '<span class="card-value '+c+'">'+r.toFixed(1)+'%</span>';}
function toast(msg,type){var t=el("div",{class:"toast "+(type||"")},esc(msg));$("#toast-wrap").appendChild(t);setTimeout(function(){t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(function(){t.remove();},300);},3000);}
function showModal(title,bodyHtml,footHtml,wide){
  $("#modal-root").innerHTML='<div class="modal-mask" id="modal-mask"><div class="modal'+(wide?' wide':'')+'"><button class="close" onclick="closeModal()">×</button><div class="modal-head"><h3>'+esc(title)+'</h3></div><div class="modal-body">'+bodyHtml+'</div>'+(footHtml?'<div class="modal-foot">'+footHtml+'</div>':'')+'</div></div>';
  $("#modal-mask").addEventListener("click",function(e){if(e.target===this)closeModal();});
}
function closeModal(){$("#modal-root").innerHTML="";}
// 自定义确认弹窗（替代浏览器原生 confirm）
function gwConfirm(msg){
  return new Promise(function(resolve){
    showModal("确认操作",
      '<div style="padding:8px 0;font-size:14px">'+esc(msg)+'</div>',
      '<button class="btn" onclick="closeModal();window._gwConfirmResolve(false)">取消</button><button class="btn btn-primary" onclick="closeModal();window._gwConfirmResolve(true)">确认</button>');
    window._gwConfirmResolve=resolve;
  });
}
function api(method,path,body,raw){
  var opt={method:method,headers:{"Content-Type":"application/json"}};
  if(state.token)opt.headers["Authorization"]="Bearer "+state.token;
  if(state.csrf)opt.headers["X-CSRF-Token"]=state.csrf;
  if(body!=null)opt.body=JSON.stringify(body);
  return fetch(API_BASE+path,opt).then(function(r){
    if(r.status===401){logout();throw new Error("未授权，请重新登录");}
    if(raw)return r.text();
    return r.json().then(function(d){if(!r.ok){var m=(d.error&&d.error.message)||r.statusText;throw new Error(m);}return d;});
  });
}
function checkAuth(){if(!state.token){showLogin();return false;}showApp();return true;}
function showLogin(){$("#login-view").classList.remove("hidden");$("#app").classList.add("hidden");state.token="";sDel(TOKEN_KEY);$("#login-password").value="";}
function showApp(){$("#login-view").classList.add("hidden");$("#app").classList.remove("hidden");renderNav();navigate(state.page);}
function logout(){showLogin();}
function renderNav(){
  var nav=$("#nav");nav.innerHTML="";
  NAV.forEach(function(n){var it=el("div",{class:"nav-item"+(n.id===state.page?" active":"")});it.innerHTML='<span class="ic">'+n.ic+'</span><span>'+esc(n.name)+'</span>';it.onclick=function(){navigate(n.id);closeSidebar();};nav.appendChild(it);});
}
function navigate(page){
  state.page=page;
  var items=document.querySelectorAll(".nav-item");
  NAV.forEach(function(n,i){items[i].className="nav-item"+(n.id===page?" active":"");});
  var titles={dashboard:"仪表盘",upstreams:"上游密钥管理",clients:"客户端管理",logs:"请求日志",settings:"系统配置",monitor:"系统监控",mail:"邮件管理"};
  $("#page-title").textContent=titles[page];
  $("#content").scrollTop=0;
  var loaders={dashboard:loadDashboard,upstreams:loadUpstreams,clients:loadClients,logs:loadLogs,settings:loadSettings,monitor:loadMonitor,mail:loadMail};
  (loaders[page]||function(){})();
}
function toggleSidebar(){$("#sidebar").classList.toggle("open");}
function closeSidebar(){$("#sidebar").classList.remove("open");}
function setLoading(){return '<div class="empty"><span class="loading"></span> 加载中...</div>';}

/* 仪表盘 */
function loadDashboard(){
  $("#content").innerHTML=setLoading();
  Promise.all([api("GET","/dashboard"),api("GET","/request-logs-stats/summary"),api("GET","/error-stats"),api("GET","/stats/request-trend?hours=168")])
  .then(function(r){renderDashboard(r[0],r[1],r[2],r[3]);})
  .catch(function(e){$("#content").innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';});
}
function renderDashboard(dash,summary,errs,trend){
  var s=dash.status||{}, sr=summary.success_rate||0;
  var cards=[
    {t:"今日请求 (24h)",v:fmtNum(dash.requests_24h||0)},
    {t:"成功率",v:sr.toFixed(1)+"%",cls:sr>=95?"success":sr>=80?"warn":"danger"},
    {t:"活跃上游密钥",v:fmtNum(dash.active_upstreams||0)},
    {t:"客户端密钥",v:fmtNum(dash.api_keys||0)},
    {t:"429 限流次数",v:fmtNum(errs.rate_limited_429||0),cls:"warn"},
    {t:"5xx 错误次数",v:fmtNum(errs.server_5xx||0),cls:"danger"},

/* 上游密钥 */
function loadUpstreams(){
  $("#content").innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:15px">上游密钥列表</h3><button class="btn btn-primary" onclick="showUpstreamModal()">+ 创建密钥</button></div><div id="up-list">'+setLoading()+'</div>';
  api("GET","/upstreams").then(function(r){state.upstreamData=r.data||[];renderUpstreams(state.upstreamData);}).catch(function(e){$("#up-list").innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';});
  // 启动本地倒计时（每秒更新），后台每 30 秒刷新数据
  startCooldownTicker();
  if(state._upstreamRefresh)clearInterval(state._upstreamRefresh);
  state._upstreamRefresh=setInterval(function(){
    if(state.page!=="upstreams"){clearInterval(state._upstreamRefresh);return;}
    api("GET","/upstreams").then(function(r){state.upstreamData=r.data||[];renderUpstreams(state.upstreamData);}).catch(function(){});
  },30000);
}
// 本地倒计时：每秒刷新冷却倒计时和状态，无需 API 调用
function startCooldownTicker(){
  if(state._cdTicker)clearInterval(state._cdTicker);
  state._cdTicker=setInterval(function(){
    if(state.page!=="upstreams"){clearInterval(state._cdTicker);return;}
    var rows=document.querySelectorAll("#up-list tbody tr");
    rows.forEach(function(tr){
      var cdCell=tr.querySelector(".cd-cell");
      var stCell=tr.querySelector(".st-cell");
      if(!cdCell)return;
      var remain=parseInt(cdCell.getAttribute("data-cd"))||0;
      if(remain>0){
        remain--;
        cdCell.setAttribute("data-cd",remain);
        var cdMin=Math.floor(remain/60), cdRem=remain%60;
        cdCell.innerHTML='<span style="color:var(--warn);font-weight:500">'+(cdMin>0?cdMin+'m'+cdRem+'s':remain+'s')+'</span>';
        // 更新状态列颜色
        if(stCell&&!stCell.querySelector(".badge-cooling")){
          stCell.innerHTML='<span class="badge badge-cooling">冷却中</span>';
        }
      }else{
        cdCell.innerHTML='<span style="color:var(--text2)">-</span>';
        if(stCell&&stCell.querySelector(".badge-cooling")){
          stCell.innerHTML='<span class="badge badge-active">活跃</span>';
        }
      }
    });
  },1000);
}
function renderUpstreams(data){
  if(!data.length){$("#up-list").innerHTML='<div class="empty">暂无上游密钥</div>';return;}
  var total=data.length;
  var s=state.upstreamSort;
  var rows=data.slice().sort(function(a,b){
    if(!s.key)return 0;
    var x=a[s.key],y=b[s.key];
    if(x==null)x="";if(y==null)y="";
    if(s.key==="name"){
      var nx=parseInt(String(x).match(/\d+/))||0;
      var ny=parseInt(String(y).match(/\d+/))||0;
      return (nx-ny)*s.dir;
    }
    if(typeof x==="number"&&typeof y==="number")return (x-y)*s.dir;
    var xs=String(x).toLowerCase(),ys=String(y).toLowerCase();
    if(xs<ys)return -1*s.dir;
    if(xs>ys)return 1*s.dir;
    return 0;
  });
  function sortTh(key,label){
    var arrow="";
    if(s.key===key)arrow=s.dir>0?" ▲":" ▼";
    return '<th onclick="sortUpstreams(\''+key+'\')">'+label+arrow+'</th>';
  }
  var h='<div class="table-wrap"><table><thead><tr>'+
    sortTh("name","名称")+sortTh("provider","Provider")+
    sortTh("status","状态")+sortTh("cooldown_remaining","冷却")+sortTh("health_score","健康")+
    sortTh("total_429","429次数")+sortTh("total_5xx","5xx次数")+
    sortTh("created_at","创建时间")+'<th>操作</th></tr></thead><tbody>';
  rows.forEach(function(u){
    var statusBtn;
    if(u.status==="active"){
      statusBtn='<button class="btn btn-sm" onclick="toggleUpstream(\''+u.id+'\',true)">停用</button>';
    }else if(u.status==="frozen"||u.status==="cooling"){
      statusBtn='<button class="btn btn-sm" onclick="unfreezeUpstream(\''+u.id+'\')">解冻</button>';
    }else{
      statusBtn='<button class="btn btn-sm" onclick="toggleUpstream(\''+u.id+'\',false)">启用</button>';
    }
    // 冷却倒计时：存储剩余秒数，由本地定时器每秒更新
    var cdSec=u.cooldown_active?u.cooldown_remaining||0:0;
    var cdHtml;
    if(cdSec>0){
      var cdMin=Math.floor(cdSec/60), cdRem=cdSec%60;
      cdHtml='<span class="cd-cell" data-cd="'+cdSec+'" style="color:var(--warn);font-weight:500">'+(cdMin>0?cdMin+'m'+cdRem+'s':cdSec+'s')+'</span>';
    }else{
      cdHtml='<span class="cd-cell" data-cd="0" style="color:var(--text2)">-</span>';
    }
    // 状态：冷却中显示橙色
    var stHtml;
    if(u.cooldown_active){
      stHtml='<span class="st-cell badge badge-cooling">冷却中</span>';
    }else{
      stHtml='<span class="st-cell">'+statusBadge(u.status)+'</span>';
    }
    var hs=u.health_score||0;
    var hsColor=hs>=80?'var(--success)':hs>=50?'var(--warn)':'var(--danger)';
    var hsHtml='<span style="color:'+hsColor+';font-weight:500">'+(hs>0?hs.toFixed(0):'-')+'</span>';
    var sr=u.success_rate!=null?u.success_rate:100;
    var srHtml='<span style="color:'+(sr>=80?'var(--success)':sr>=50?'var(--warn)':'var(--danger)')+'">'+sr.toFixed(0)+'%</span>';
    h+='<tr><td>'+esc(u.name)+'</td><td><span class="tag">'+esc(u.provider)+'</span></td>'+
      '<td>'+stHtml+'</td><td>'+cdHtml+'</td><td>'+hsHtml+'</td>'+
      '<td>'+(u.total_requests||0)+'</td><td>'+srHtml+'</td>'+
      '<td>'+(u.total_429||0)+'</td><td>'+(u.total_5xx||0)+'</td>'+
      '<td style="color:var(--text2)">'+fmtTime(u.created_at)+'</td>'+
      '<td class="actions"><button class="btn btn-sm" onclick="editUpstream(\''+u.id+'\')">编辑</button>'+
      '<button class="btn btn-sm" onclick="revealUpstream(\''+u.id+'\')">查看明文</button>'+
      statusBtn+
      '<button class="btn btn-sm btn-danger" onclick="deleteUpstream(\''+u.id+'\',\''+esc(u.name).replace(/'/g,"")+'\')">删除</button></td></tr>';
  });
  h+='</tbody></table></div><div class="pager"><span>共 '+total+' 条</span></div>';
  $("#up-list").innerHTML=h;
  // 重新启动倒计时（renderUpstreams 替换了 DOM，需要重新绑定）
  startCooldownTicker();
}
function statusBadge(s){
  if(s==="active")return '<span class="badge badge-active">活跃</span>';
  if(s==="frozen"||s==="cooling")return '<span class="badge badge-frozen">冻结</span>';
  if(s==="inactive")return '<span class="badge badge-inactive">停用</span>';
  if(s==="banned"||s==="revoked")return '<span class="badge badge-banned">禁用</span>';
  return '<span class="badge badge-inactive">'+esc(s||"-")+'</span>';
}
function upstreamFormHtml(u,isEdit){
  var pv=u.provider||"nvidia";
  var opts=["nvidia","openai","anthropic","custom"].map(function(p){return '<option value="'+p+'"'+(pv===p?"selected":"")+">"+p+"</option>";}).join("");
  return '<form id="up-form" onsubmit="return false">'+
    '<div class="form-row"><label>名称</label><input class="input" name="name" value="'+esc(u.name||"")+'" required></div>'+
    '<div class="form-row"><label>Provider</label><select class="input" name="provider">'+opts+'</select></div>'+
    (isEdit?'':'<div class="form-row"><label>API Key</label><input class="input" name="api_key" placeholder="sk-..." required></div>')+
    '<div class="form-grid"><div class="form-row"><label>权重</label><input class="input" type="number" name="weight" value="'+(u.weight||1)+'" min="1"></div>'+
    '<div class="form-row"><label>RPM 限制</label><input class="input" type="number" name="rpm_limit" value="'+(u.rpm_limit||40)+'" min="0"></div></div>'+

function showUpstreamModal(id){

function openUpstreamModal(u,isEdit){

    '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="submitUpstream('+(isEdit?"'"+u.id+"'":"''")+')">'+(isEdit?"保存":"创建")+'</button>');

function submitUpstream(id){
  var d=formToJson($("#up-form"));

    api("PUT","/upstreams/"+id,{name:d.name,weight:+d.weight,rpm_limit:+d.rpm_limit,switch_threshold:+d.switch_threshold})
    .then(function(){toast("保存成功","success");closeModal();loadUpstreams();}).catch(function(e){toast(e.message,"error");});
  }else{
    api("POST","/upstreams",{name:d.name,provider:d.provider,api_key:d.api_key,weight:+d.weight,rpm_limit:+d.rpm_limit,switch_threshold:+d.switch_threshold})
    .then(function(){toast("创建成功","success");closeModal();loadUpstreams();}).catch(function(e){toast(e.message,"error");});
  }
}
function editUpstream(id){showUpstreamModal(id);}
function revealUpstream(id){
  api("GET","/upstreams/"+id+"/reveal").then(function(r){
    showModal("查看明文密钥 - "+esc(r.name),
      '<div class="kv"><span class="k">Provider</span><span class="v">'+esc(r.provider)+'</span></div>'+
      '<div class="kv"><span class="k">前缀</span><span class="v">'+esc(r.prefix)+'</span></div>'+

      '<div class="form-row" style="margin-top:12px"><label>API Key 明文（仅本次显示）</label><textarea class="input" rows="3" id="reveal-text" readonly>'+esc(r.api_key)+'</textarea></div>',
      '<button class="btn" onclick="copyText(\'reveal-text\')">复制</button><button class="btn btn-primary" onclick="closeModal()">关闭</button>');

function unfreezeUpstream(id){gwConfirm("确定解冻该上游密钥？").then(function(ok){if(!ok)return;api("POST","/upstreams/"+id+"/unfreeze").then(function(){toast("已解冻","success");loadUpstreams();}).catch(function(e){toast(e.message,"error");});});}
function deleteUpstream(id,name){gwConfirm("确定删除密钥「"+name+"」？此操作不可恢复。").then(function(ok){if(!ok)return;api("DELETE","/upstreams/"+id).then(function(){toast("已删除","success");loadUpstreams();}).catch(function(e){toast(e.message,"error");});});}
// 切换上游密钥列表排序：点击表头按该列排序，再次点击反转方向
function sortUpstreams(key){
  var s=state.upstreamSort;
  if(s.key===key)s.dir=-s.dir;else{s.key=key;s.dir=1;}
  renderUpstreams(state.upstreamData);
}
// 停用/启用上游密钥：调用 PUT 切换状态后刷新列表
function toggleUpstream(id,isActive){

      .then(function(){toast(isActive?"已停用":"已启用","success");loadUpstreams();})

/* 分页器 */
function pagerHtml(page,tp,total,key,fn){
  if(tp<=1)return '<div class="pager"><span>共 '+total+' 条</span></div>';
  var h='<div class="pager"><span>共 '+total+' 条</span>';
  h+='<button onclick="'+(page<=1?'':'setPage(\''+key+'\','+(page-1)+',\''+fn+'\')')+'" '+(page<=1?'disabled':'')+'>‹</button>';
  var from=Math.max(1,page-3), to=Math.min(tp,from+6);
  if(from>1){h+='<button onclick="setPage(\''+key+'\',1,\''+fn+'\')">1</button>';if(from>2)h+='<span>…</span>';}
  for(var i=from;i<=to;i++){h+='<button class="'+(i===page?"active":"")+'" onclick="setPage(\''+key+'\','+i+',\''+fn+'\')">'+i+'</button>';}
  if(to<tp){if(to<tp-1)h+='<span>…</span>';h+='<button onclick="setPage(\''+key+'\','+tp+',\''+fn+'\')">'+tp+'</button>';}
  h+='<button onclick="'+(page>=tp?'':'setPage(\''+key+'\','+(page+1)+',\''+fn+'\')')+'" '+(page>=tp?'disabled':'')+'>›</button></div>';
  return h;
}

function formToJson(form){var d={};form.querySelectorAll("input,select,textarea").forEach(function(e){d[e.name]=e.value;});return d;}
// 复制文本到剪贴板：优先 navigator.clipboard，失败回退到 textarea + execCommand
function copyText(id){
  var t=$("#"+id);if(!t)return;
  var text=t.value!=null?t.value:t.textContent;
  copyToClipboard(text);
}
// 复制任意文本到剪贴板，成功后弹出 Toast
function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast("已复制到剪贴板","success");})
      .catch(function(){fallbackCopy(text);});
  }else{
    fallbackCopy(text);
  }
}
// 回退方案：临时 textarea + execCommand
function fallbackCopy(text){
  try{
    var ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.top="-9999px";
    document.body.appendChild(ta);ta.focus();ta.select();
    var ok=document.execCommand("copy");
    document.body.removeChild(ta);
    if(ok)toast("已复制到剪贴板","success");else toast("复制失败","error");
  }catch(e){toast("复制失败","error");}
}

}
function renderMailList(mails){
  var h='<div style="padding:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0;color:var(--text)">收件箱 <span style="color:var(--text2);font-weight:normal;font-size:13px">('+mails.length+'封)</span></h3><button class="btn btn-sm" onclick="loadMail()">刷新</button></div><div class="table-wrap"><table><thead><tr><th style="width:60px">#</th><th>发件人</th><th>主题</th><th style="width:160px">时间</th><th style="width:60px">大小</th></tr></thead><tbody>';
  mails.forEach(function(m){
    var subj=m.subject||"(无主题)";
    var from=m.from||"未知";
    if(from.indexOf("<")>0)from=from.split("<")[0].replace(/"/g,"").trim();
    var size=m.size>1024?(m.size/1024).toFixed(1)+"KB":m.size+"B";
    h+='<tr style="cursor:pointer" onclick="viewMail(\''+String(m.id).replace(/'/g,'')+'\')"><td>'+m.id+'</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">'+esc(from)+'</td><td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;font-weight:'+((m.subject||"").indexOf("Re:")>=0?"bold":"normal")+'">'+esc(subj)+'</td><td style="font-size:12px">'+fmtTime(m.date)+'</td><td style="font-size:12px;color:var(--text2)">'+size+'</td></tr>';
  });
  h+='</tbody></table></div>';
  if(mails.length===0)h+='<div class="empty">暂无邮件</div>';
  h+='</div>';
  $("#content").innerHTML=h;
}
function viewMail(id){
  showModal("邮件详情",'<div style="padding:16px"><span class="loading"></span> 加载中...</div>');
  api("GET","/mail/detail?id="+id).then(function(r){
    var m=r.mail;if(!m){closeModal();return;}
    var body=m.body||"";
    var html=m.html||"";
    // 优先显示HTML，否则显示纯文本
    var display=html||('<pre style="white-space:pre-wrap;font-family:inherit;margin:0;line-height:1.6">'+esc(body)+'</pre>');
    var h='<div style="max-height:70vh;overflow-y:auto">';
    h+='<div style="background:var(--bg);padding:12px;border-radius:6px;margin-bottom:12px;font-size:13px">';
    h+='<div><strong>发件人:</strong> '+esc(m.from||"未知")+'</div>';
    h+='<div><strong>收件人:</strong> '+esc(m.to||"未知")+'</div>';
    h+='<div><strong>主题:</strong> '+esc(m.subject||"(无主题)")+'</div>';
    h+='<div><strong>时间:</strong> '+fmtTime(m.date)+'</div>';
    h+='<div><strong>大小:</strong> '+(m.size>1024?(m.size/1024).toFixed(1)+"KB":m.size+"B")+'</div>';
    h+='</div>';
    h+='<div style="border:1px solid var(--border);border-radius:6px;padding:16px;background:#fff;min-height:200px">'+display+'</div>';
    h+='</div>';
    showModal("邮件详情 - "+esc(m.subject||"(无主题)"),h,
      '<button class="btn" onclick="closeModal()">关闭</button>');
  }).catch(function(e){closeModal();toast("加载失败: "+e.message,"error");});
}
</script>
</body>
</html>

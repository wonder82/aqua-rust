# ============================================================
# AQUA Nginx 配置示例（平台 acu.example.com + 网关 api.example.com）
# 灰度发布：new=8000/8001（当前） old=8008/8009（上一稳定，仅回滚）
# 切流：调整 new weight（灰度为 new=1 old=9 → 100% 时 new=10）
# ============================================================

upstream aqua_platform_pool {
    # 灰度：权重调整 new/old
    server 127.0.0.1:8000 weight=1 max_fails=3 fail_timeout=10s;   # new
    # server 127.0.0.1:8008 weight=9 max_fails=3 fail_timeout=10s; # old（回滚时启用）
    keepalive 32;
}

upstream aqua_gateway_pool {
    server 127.0.0.1:8001 weight=1 max_fails=3 fail_timeout=10s;   # new
    # server 127.0.0.1:8009 weight=9 max_fails=3 fail_timeout=10s; # old
    keepalive 32;
}

# ===================== 平台 =====================
server {
    listen 80;
    server_name acu.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name acu.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # SSE 直通（不缓冲，防聊天流卡顿）
    location /api/chat/completions {
        proxy_pass http://aqua_platform_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://aqua_platform_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ===================== 网关 =====================
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.example.com;

    # 合并证书：acu.example.com + api.example.com 同一张 Let's Encrypt 证书
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # SSE 流式端点（不缓冲）
    location ~ ^/(api/)?v1/(chat/completions|messages|responses) {
        proxy_pass http://aqua_gateway_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://aqua_gateway_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
